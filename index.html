<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plaza Libre — Compra y Venta</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --primary: #1E40AF;
      --primary-dark: #1E3A8A;
      --accent: #F59E0B;
      --accent-dark: #D97706;
      --success: #10B981;
      --danger: #EF4444;
      --text: #1E293B;
      --muted: #64748B;
      --border: #E2E8F0;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--primary);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 10px rgba(30, 64, 175, 0.25);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accent);
      color: #0F172A;
      font-weight: 800;
      font-size: 1.15rem;
      display: grid;
      place-items: center;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .search-box {
      flex: 1 1 280px;
      display: flex;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
    }

    .search-box input {
      flex: 1;
      border: none;
      padding: 10px 14px;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
    }

    .search-box button {
      background: var(--accent);
      color: #0F172A;
      border: none;
      padding: 0 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-box button:hover {
      background: var(--accent-dark);
      color: #fff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 9px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-publish {
      background: var(--accent);
      color: #0F172A;
      font-weight: 800;
    }

    .btn-publish:hover {
      background: var(--accent-dark);
      color: #fff;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }

    .btn-ghost.active {
      background: #fff;
      color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .currency-select {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .currency-select option {
      color: var(--text);
      background: #fff;
    }

    /* Categories & Filters */
    .toolbar {
      max-width: 1240px;
      width: 100%;
      margin: 16px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .cat-pill {
      white-space: nowrap;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .cat-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .filter-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .filter-row input,
    .filter-row select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.88rem;
      background: var(--bg);
      color: var(--text);
    }

    .results-info {
      font-size: 0.88rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Grid */
    main {
      max-width: 1240px;
      width: 100%;
      margin: 18px auto 36px;
      padding: 0 16px;
      flex: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.14s ease, box-shadow 0.14s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.1);
    }

    .card-img-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #E2E8F0;
      cursor: pointer;
      overflow: hidden;
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge-featured {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--accent);
      color: #0F172A;
      font-size: 0.74rem;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .fav-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: #475569;
      font-size: 1.05rem;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .fav-btn.active {
      color: var(--danger);
    }

    .card-body {
      padding: 12px 14px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .price {
      font-size: 1.18rem;
      font-weight: 800;
      color: var(--primary);
    }

    .price-alt {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    .title {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .condition-tag {
      background: #EFF6FF;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.74rem;
    }

    .empty-state {
      text-align: center;
      padding: 56px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
      overflow-y: auto;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 20px;
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 800;
    }

    .close-btn {
      background: #F1F5F9;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .field label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 0.92rem;
      background: var(--bg);
      color: var(--text);
    }

    .field textarea {
      min-height: 84px;
      resize: vertical;
    }

    .preview-box {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      max-height: 210px;
      display: none;
    }

    .preview-box img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
    }

    .detail-img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 14px;
      background: #E2E8F0;
    }

    .qa-list, .chat-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .msg-item {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.86rem;
    }

    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 3px;
      font-weight: 600;
    }

    .inline-send {
      display: flex;
      gap: 8px;
    }

    .inline-send input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.9rem;
    }

    /* Admin table */
    .admin-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .admin-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--bg);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .admin-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Footer */
    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 16px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .footer-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .secret-trigger {
      cursor: pointer;
      user-select: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0F172A;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 90;
      display: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .toast.show {
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand" onclick="resetHome()">
        <div class="brand-badge">PL</div>
        <div class="brand-name">Plaza Libre</div>
      </div>

      <form class="search-box" onsubmit="event.preventDefault(); renderListings();">
        <input id="searchInput" type="search" placeholder="Buscar productos, vehículos, repuestos, servicios..." />
        <button type="submit">Buscar</button>
      </form>

      <div class="header-actions">
        <select id="currencySelect" class="currency-select" onchange="changeCurrency()">
          <option value="USD">$ USD</option>
          <option value="VES">Bs</option>
        </select>
        <button id="favFilterBtn" class="btn btn-ghost" onclick="toggleFavFilter()">Favoritos (<span id="favCount">0</span>)</button>
        <button class="btn btn-publish" onclick="openPublishModal()">+ Publicar</button>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <div class="categories" id="categoryBar"></div>

    <div class="filter-row">
      <div class="filter-group">
        <input id="locationFilter" type="text" placeholder="Ciudad o zona" oninput="renderListings()" />
        <select id="conditionFilter" onchange="renderListings()">
          <option value="">Condición: Todas</option>
          <option value="Nuevo">Nuevo</option>
          <option value="Usado">Usado</option>
        </select>
        <input id="minPriceFilter" type="number" min="0" step="any" placeholder="Precio mín ($)" style="width:120px" oninput="renderListings()" />
        <input id="maxPriceFilter" type="number" min="0" step="any" placeholder="Precio máx ($)" style="width:120px" oninput="renderListings()" />
        <select id="sortFilter" onchange="renderListings()">
          <option value="recent">Más recientes</option>
          <option value="featured">Destacados primero</option>
          <option value="price_asc">Menor precio</option>
          <option value="price_desc">Mayor precio</option>
        </select>
      </div>
      <div class="results-info" id="resultsInfo">0 publicaciones</div>
    </div>
  </div>

  <main>
    <div class="grid" id="listingsGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h3>No se encontraron publicaciones</h3>
      <p style="color:var(--muted); margin:8px 0 16px;">Prueba con otra palabra, limpia los filtros o sé el primero en publicar.</p>
      <button class="btn btn-primary" onclick="clearFilters()">Limpiar filtros</button>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <div>Compra y venta directa entre personas y negocios.</div>
      <div class="secret-trigger" onclick="handleSecretClick()">© 2026 Plaza Libre</div>
    </div>
  </footer>

  <!-- Modal Publicar -->
  <div class="modal-backdrop" id="publishModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Publicar artículo</h2>
        <button class="close-btn" onclick="closeModal('publishModal')">&times;</button>
      </div>
      <form onsubmit="submitListing(event)">
        <div class="field">
          <label>Título de la publicación *</label>
          <input id="pubTitle" type="text" required placeholder="Ej. Moto Bera SBR 150 operativa o Laptop i5" />
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Categoría *</label>
            <select id="pubCategory" required></select>
          </div>
          <div class="field">
            <label>Condición *</label>
            <select id="pubCondition" required>
              <option value="Usado">Usado</option>
              <option value="Nuevo">Nuevo</option>
            </select>
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Precio en USD ($) *</label>
            <input id="pubPrice" type="number" min="0" step="0.01" required placeholder="Ej. 120" />
          </div>
          <div class="field">
            <label>Ubicación (Ciudad / Sector) *</label>
            <input id="pubLocation" type="text" required placeholder="Ej. Puerto Ordaz, Alta Vista" />
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>Nombre del vendedor *</label>
            <input id="pubSeller" type="text" required placeholder="Tu nombre o tienda" />
          </div>
          <div class="field">
            <label>Teléfono / WhatsApp (opcional)</label>
            <input id="pubPhone" type="text" placeholder="Ej. 04141234567" />
          </div>
        </div>

        <div class="field">
          <label>Foto del producto</label>
          <input id="pubPhotoFile" type="file" accept="image/*" onchange="handlePhotoUpload(event)" />
          <div class="preview-box" id="pubPreviewBox">
            <img id="pubPreviewImg" alt="Vista previa" />
          </div>
        </div>

        <div class="field">
          <label>Descripción *</label>
          <textarea id="pubDesc" required placeholder="Detalla estado, características, entrega o negociación..."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px;">
          <button type="button" class="btn btn-outline" onclick="closeModal('publishModal')">Cancelar</button>
          <button type="submit" class="btn btn-publish">Publicar ahora</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Detalle Producto -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal" id="detailModalContent"></div>
  </div>

  <!-- Modal Clave Privada -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal" style="max-width:380px;">
      <div class="modal-header">
        <h2>Acceso</h2>
        <button class="close-btn" onclick="closeModal('authModal')">&times;</button>
      </div>
      <form onsubmit="verifyAdminKey(event)">
        <div class="field">
          <label>Clave</label>
          <input id="adminKeyInput" type="password" autocomplete="off" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Modal Panel Administrativo -->
  <div class="modal-backdrop" id="adminModal">
    <div class="modal" style="max-width:820px;">
      <div class="modal-header">
        <h2>Panel de Administración — Plaza Libre</h2>
        <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
      </div>

      <div class="admin-tabs">
        <button class="btn btn-primary" id="tabPubs" onclick="switchAdminTab('pubs')">Publicaciones</button>
        <button class="btn btn-outline" id="tabReports" onclick="switchAdminTab('reports')">Reportes</button>
        <button class="btn btn-outline" id="tabSettings" onclick="switchAdminTab('settings')">Tasa y Conexión</button>
      </div>

      <div id="adminBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

        paused: false,
        createdAt: Date.now() - 3600000 * 24,
        image: "https://images.unsplash.com/photo-1617806118233-18e1de247200?auto=format&fit=crop&w=800&q=70",
        desc: "Mesa firme y 6 sillas tapizadas en buen estado. Entrega acordada en la ciudad.",
        questions: [],
        chats: []
      },
      {
        id: "item-4",
        title: "Servicio Técnico de Redes, Cámaras y Soporte PC",
        category: "Servicios",
        condition: "Nuevo",
        priceUsd: 25,
        location: "Caroní",
        seller: "Soporte Digital",
        phone: "04167772211",
        featured: false,
        paused: false,
        createdAt: Date.now() - 3600000 * 30,
        image: "https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=800&q=70",
        desc: "Configuración de routers, redes locales, cámaras de seguridad, mantenimiento y diagnóstico de equipos.",
        questions: [],
        chats: []
      }
    ];

    let state = {
      listings: loadListings(),
      favorites: JSON.parse(localStorage.getItem(STORAGE_KEYS.FAVS) || "[]"),
      reports: JSON.parse(localStorage.getItem(STORAGE_KEYS.REPORTS) || "[]"),
      rate: parseFloat(localStorage.getItem(STORAGE_KEYS.RATE) || "45"),
      currency: "USD",
      category: "Todo",
      onlyFavs: false,
      uploadedPhotoData: "",
      secretClicks: 0,
      adminUnlocked: false,
      adminTab: "pubs"
    };

    function loadListings() {
      const raw = localStorage.getItem(STORAGE_KEYS.LISTINGS);
      if (!raw) {
        localStorage.setItem(STORAGE_KEYS.LISTINGS, JSON.stringify(DEFAULT_LISTINGS));
        return [...DEFAULT_LISTINGS];
      }
      try {
        return JSON.parse(raw);
      } catch {
        return [...DEFAULT_LISTINGS];
      }
    }

    function saveListings() {
      localStorage.setItem(STORAGE_KEYS.LISTINGS, JSON.stringify(state.listings));
    }

    function saveFavs() {
      localStorage.setItem(STORAGE_KEYS.FAVS, JSON.stringify(state.favorites));
      updateFavCount();
    }

    function saveReports() {
      localStorage.setItem(STORAGE_KEYS.REPORTS, JSON.stringify(state.reports));
    }

    function updateFavCount() {
      document.getElementById("favCount").textContent = state.favorites.length;
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function formatPrice(usd) {
      const amount = Number(usd) || 0;
      if (state.currency === "VES") {
        const ves = amount * state.rate;
        return {
          main: `Bs ${ves.toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`,
          sub: `$ ${amount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
        };
      }
      return {
        main: `$ ${amount.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`,
        sub: `Bs ${(amount * state.rate).toLocaleString("es-VE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
      };
    }

    function renderCategories() {
      const bar = document.getElementById("categoryBar");
      const pubCat = document.getElementById("pubCategory");
      bar.innerHTML = "";
      pubCat.innerHTML = "";

      CATEGORIES.forEach((cat) => {
        const pill = document.createElement("button");
        pill.className = "cat-pill" + (state.category === cat ? " active" : "");
        pill.textContent = cat;
        pill.onclick = () => {
          state.category = cat;
          renderCategories();
          renderListings();
        };
        bar.appendChild(pill);

        if (cat !== "Todo") {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          pubCat.appendChild(opt);
        }
      });
    }

    function getFilteredListings() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const loc = document.getElementById("locationFilter").value.trim().toLowerCase();
      const cond = document.getElementById("conditionFilter").value;
      const minP = parseFloat(document.getElementById("minPriceFilter").value);
      const maxP = parseFloat(document.getElementById("maxPriceFilter").value);
      const sort = document.getElementById("sortFilter").value;

      let list = state.listings.filter((item) => !item.paused);

      if (state.onlyFavs) {
        list = list.filter((item) => state.favorites.includes(item.id));
      }
      if (state.category !== "Todo") {
        list = list.filter((item) => item.category === state.category);
      }
      if (q) {
        list = list.filter(
          (item) =>
            item.title.toLowerCase().includes(q) ||
            item.desc.toLowerCase().includes(q) ||
            item.category.toLowerCase().includes(q)
        );
      }
      if (loc) {
        list = list.filter((item) => (item.location || "").toLowerCase().includes(loc));
      }
      if (cond) {
        list = list.filter((item) => item.condition === cond);
      }
      if (!isNaN(minP)) {
        list = list.filter((item) => Number(item.priceUsd) >= minP);
      }
      if (!isNaN(maxP)) {
        list = list.filter((item) => Number(item.priceUsd) <= maxP);
      }

      if (sort === "featured") {
        list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || b.createdAt - a.createdAt);
      } else if (sort === "price_asc") {
        list.sort((a, b) => Number(a.priceUsd) - Number(b.priceUsd));
      } else if (sort === "price_desc") {
        list.sort((a, b) => Number(b.priceUsd) - Number(a.priceUsd));
      } else {
        list.sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0) || b.createdAt - a.createdAt);
      }

      return list;
    }

    function renderListings() {
      const grid = document.getElementById("listingsGrid");
      const empty = document.getElementById("emptyState");
      const info = document.getElementById("resultsInfo");
      const items = getFilteredListings();

      info.textContent = `${items.length} ${items.length === 1 ? "publicación" : "publicaciones"}`;
      grid.innerHTML = "";

      if (items.length === 0) {
        empty.style.display = "block";
        return;
      }
      empty.style.display = "none";

      items.forEach((item) => {
        const p = formatPrice(item.priceUsd);
        const isFav = state.favorites.includes(item.id);
        const fallbackImg = "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=70";

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div class="card-img-wrap" onclick="openDetail('${item.id}')">
            <img src="${item.image || fallbackImg}" alt="${escapeHtml(item.title)}" onerror="this.src='${fallbackImg}'" />
            ${item.featured ? '<span class="badge-featured">DESTACADO</span>' : ""}
            <button class="fav-btn ${isFav ? "active" : ""}" title="Favorito" onclick="event.stopPropagation(); toggleFav('${item.id}')">
              ${isFav ? "♥" : "♡"}
            </button>
          </div>
          <div class="card-body">
            <div class="price">${p.main}</div>
            <div class="price-alt">${p.sub}</div>
            <div class="title" onclick="openDetail('${item.id}')">${escapeHtml(item.title)}</div>
            <div class="meta">
              <span>${escapeHtml(item.location || "")}</span>
              <span class="condition-tag">${escapeHtml(item.condition || "Usado")}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toggleFav(id) {
      const idx = state.favorites.indexOf(id);
      if (idx >= 0) {
        state.favorites.splice(idx, 1);
        showToast("Quitado de favoritos");
      } else {
        state.favorites.push(id);
        showToast("Guardado en favoritos");
      }
      saveFavs();
      renderListings();
    }

    function toggleFavFilter() {
      state.onlyFavs = !state.onlyFavs;
      document.getElementById("favFilterBtn").classList.toggle("active", state.onlyFavs);
      renderListings();
    }

    function changeCurrency() {
      state.currency = document.getElementById("currencySelect").value;
      renderListings();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("locationFilter").value = "";
      document.getElementById("conditionFilter").value = "";
      document.getElementById("minPriceFilter").value = "";
      document.getElementById("maxPriceFilter").value = "";
      document.getElementById("sortFilter").value = "recent";
      state.category = "Todo";
      state.onlyFavs = false;
      document.getElementById("favFilterBtn").classList.remove("active");
      renderCategories();
      renderListings();
    }

    function resetHome() {
      clearFilters();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openPublishModal() {
      state.uploadedPhotoData = "";
      document.getElementById("pubPreviewBox").style.display = "none";
      document.getElementById("publishModal").classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function handlePhotoUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        state.uploadedPhotoData = ev.target.result;
        const box = document.getElementById("pubPreviewBox");
        const img = document.getElementById("pubPreviewImg");
        img.src = state.uploadedPhotoData;
        box.style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    function submitListing(e) {
      e.preventDefault();
      const title = document.getElementById("pubTitle").value.trim();
      const category = document.getElementById("pubCategory").value;
      const condition = document.getElementById("pubCondition").value;
      const priceUsd = parseFloat(document.getElementById("pubPrice").value);
      const location = document.getElementById("pubLocation").value.trim();
      const seller = document.getElementById("pubSeller").value.trim();
      const phone = document.getElementById("pubPhone").value.trim().replace(/\D/g, "");
      const desc = document.getElementById("pubDesc").value.trim();

      const newItem = {
        id: "item-" + Date.now(),
        title,
        category,
        condition,
        priceUsd: isNaN(priceUsd) ? 0 : priceUsd,
        location,
        seller,
        phone,
        featured: false,
        paused: false,
        createdAt: Date.now(),
        image: state.uploadedPhotoData || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=70",
        desc,
        questions: [],
        chats: []
      };

      state.listings.unshift(newItem);
      saveListings();
      e.target.reset();
      closeModal("publishModal");
      renderListings();
      showToast("Artículo publicado");
    }

    function openDetail(id) {
      const item = state.listings.find((x) => x.id === id);
      if (!item) return;
      const p = formatPrice(item.priceUsd);
      const cleanPhone = (item.phone || "").replace(/\D/g, "");
      const waPhone = cleanPhone.startsWith("0") && cleanPhone.length === 11 ? "58" + cleanPhone.slice(1) : cleanPhone;

      const qaHtml =
        (item.questions || []).length === 0
          ? '<div style="color:var(--muted); font-size:0.85rem;">Aún no hay preguntas.</div>'
          : item.questions
              .map(
                (q) => `
              <div class="msg-item">
                <div class="msg-meta">Pregunta (${escapeHtml(q.at || "")})</div>
                <div>${escapeHtml(q.ask)}</div>
                ${q.answer ? `<div style="margin-top:6px; padding-left:10px; border-left:2px solid var(--primary); color:#334155;"><strong>Respuesta:</strong> ${escapeHtml(q.answer)}</div>` : ""}
              </div>`
              )
              .join("");

      const chatHtml =
        (item.chats || []).length === 0
          ? '<div style="color:var(--muted); font-size:0.85rem;">Inicia una conversación con el vendedor.</div>'
          : item.chats
              .map(
                (m) => `
              <div class="msg-item">
                <div class="msg-meta">${escapeHtml(m.sender || "Usuario")} · ${escapeHtml(m.at || "")}</div>
                <div>${escapeHtml(m.text)}</div>
              </div>`
              )
              .join("");

      document.getElementById("detailModalContent").innerHTML = `
        <div class="modal-header">
          <h2>${escapeHtml(item.title)}</h2>
          <button class="close-btn" onclick="closeModal('detailModal')">&times;</button>
        </div>

        <img class="detail-img" src="${item.image}" alt="${escapeHtml(item.title)}" />

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
          <div>
            <div class="price" style="font-size:1.45rem;">${p.main}</div>
            <div class="price-alt">${p.sub}</div>
          </div>
          <span class="condition-tag">${escapeHtml(item.condition)} · ${escapeHtml(item.category)}</span>
        </div>

        <p style="margin-bottom:12px; color:#334155;">${escapeHtml(item.desc)}</p>
        <div style="font-size:0.88rem; color:var(--muted); margin-bottom:16px;">
          <strong>Vendedor:</strong> ${escapeHtml(item.seller)} · <strong>Ubicación:</strong> ${escapeHtml(item.location)}
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
          ${
            waPhone
              ? `<a class="btn btn-success" target="_blank" rel="noopener" href="https://wa.me/${waPhone}?text=${encodeURIComponent("Hola, vi tu publicación en Plaza Libre: " + item.title)}">Contactar por WhatsApp</a>`
              : ""
          }
          <button class="btn btn-outline" onclick="reportItem('${item.id}')">Reportar publicación</button>
        </div>

        <h3 style="font-size:1rem; margin-bottom:8px;">Preguntas y respuestas</h3>
        <div class="qa-list">${qaHtml}</div>
        <form class="inline-send" style="margin-bottom:18px;" onsubmit="addQuestion(event, '${item.id}')">
          <input type="text" id="questionInput" required placeholder="Escribe una pregunta sobre el artículo..." />
          <button type="submit" class="btn btn-primary">Preguntar</button>
        </form>

        <h3 style="font-size:1rem; margin-bottom:8px;">Chat directo</h3>
        <div class="chat-box">${chatHtml}</div>
        <form class="inline-send" onsubmit="addChatMsg(event, '${item.id}')">
          <input type="text" id="chatInput" required placeholder="Escribe un mensaje..." />
          <button type="submit" class="btn btn-publish">Enviar</button>
        </form>
      `;

      document.getElementById("detailModal").classList.add("open");
    }

    function addQuestion(e, id) {
      e.preventDefault();
      const input = document.getElementById("questionInput");
      const text = input.value.trim();
      if (!text) return;
      const item = state.listings.find((x) => x.id === id);
      if (!item) return;
      item.questions = item.questions || [];
      item.questions.push({ ask: text, answer: "", at: new Date().toLocaleDateString() });
      saveListings();
      openDetail(id);
      showToast("Pregunta enviada");
    }

    function addChatMsg(e, id) {
      e.preventDefault();
      const input = document.getElementById("chatInput");
      const text = input.value.trim();
      if (!text) return;
      const item = state.listings.find((x) => x.id === id);
      if (!item) return;
      item.chats = item.chats || [];
      item.chats.push({ sender: "Comprador", text, at: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) });
      saveListings();
      openDetail(id);
    }

    function reportItem(id) {
      const reason = prompt("Motivo del reporte:");
      if (!reason || !reason.trim()) return;
      state.reports.push({
        id: "rep-" + Date.now(),
        listingId: id,
        reason: reason.trim(),
        at: new Date().toLocaleString()
      });
      saveReports();
      showToast("Reporte registrado");
    }

    /* Acceso privado sin pistas */
    function handleSecretClick() {
      state.secretClicks += 1;
      clearTimeout(window._secretTimer);
      window._secretTimer = setTimeout(() => {
        state.secretClicks = 0;
      }, 900);

      if (state.secretClicks >= 3) {
        state.secretClicks = 0;
        if (state.adminUnlocked) {
          openAdminModal();
        } else {
          document.getElementById("adminKeyInput").value = "";
          document.getElementById("authModal").classList.add("open");
        }
      }
    }

    function verifyAdminKey(e) {
      e.preventDefault();
      const val = document.getElementById("adminKeyInput").value;
      if (val === ADMIN_SECRET) {
        state.adminUnlocked = true;
        closeModal("authModal");
        openAdminModal();
      } else {
        showToast("Clave incorrecta");
      }
    }

    function openAdminModal() {
      state.adminTab = "pubs";
      document.getElementById("adminModal").classList.add("open");
      renderAdminBody();
    }

    function switchAdminTab(tab) {
      state.adminTab = tab;
      ["pubs", "reports", "settings"].forEach((t) => {
        const btn = document.getElementById("tab" + t.charAt(0).toUpperCase() + t.slice(1));
        btn.className = "btn " + (t === tab ? "btn-primary" : "btn-outline");
      });
      renderAdminBody();
    }

    function renderAdminBody() {
      const body = document.getElementById("adminBody");

      if (state.adminTab === "pubs") {
        if (state.listings.length === 0) {
          body.innerHTML = "<p>No hay publicaciones.</p>";
          return;
        }
        body.innerHTML = state.listings
          .map(
            (item) => `
          <div class="admin-item">
            <div>
              <strong>${escapeHtml(item.title)}</strong>
              <div style="font-size:0.82rem; color:var(--muted);">
                $${Number(item.priceUsd).toFixed(2)} · ${escapeHtml(item.category)} · ${item.paused ? "PAUSADA" : "ACTIVA"} ${item.featured ? "· DESTACADA" : ""}
              </div>
            </div>
            <div class="admin-actions">
              <button class="btn btn-outline" onclick="adminToggleFeatured('${item.id}')">${item.featured ? "Quitar destacado" : "Destacar"}</button>
              <button class="btn btn-outline" onclick="adminTogglePause('${item.id}')">${item.paused ? "Activar" : "Pausar"}</button>
              <button class="btn btn-danger" onclick="adminDeleteItem('${item.id}')">Eliminar</button>
            </div>
          </div>`
          )
          .join("");
      } else if (state.adminTab === "reports") {
        if (state.reports.length === 0) {
          body.innerHTML = "<p>No hay reportes pendientes.</p>";
          return;
        }
        body.innerHTML = state.reports
          .map(
            (r) => `
          <div class="admin-item">
            <div>
              <strong>ID: ${escapeHtml(r.listingId)}</strong>
              <div style="font-size:0.85rem;">Motivo: ${escapeHtml(r.reason)}</div>
              <div style="font-size:0.78rem; color:var(--muted);">${escapeHtml(r.at)}</div>
            </div>
            <button class="btn btn-outline" onclick="dismissReport('${r.id}')">Resolver</button>
          </div>`
          )
          .join("");
      } else {
        const savedCfg = localStorage.getItem(STORAGE_KEYS.FIREBASE_CFG) || "";
        body.innerHTML = `
          <div class="field">
            <label>Tasa de cambio (Bs por $1 USD)</label>
            <input id="rateInput" type="number" step="0.01" min="0.01" value="${state.rate}" />
          </div>
          <div class="field">
            <label>Configuración Firebase (JSON)</label>
            <textarea id="firebaseCfgInput" placeholder='{"apiKey":"...","projectId":"..."}'>${escapeHtml(savedCfg)}</textarea>
          </div>
          <button class="btn btn-primary" onclick="saveAdminSettings()">Guardar configuración</button>
        `;
      }
    }

    function adminToggleFeatured(id) {
      const item = state.listings.find((x) => x.id === id);
      if (!item) return;
      item.featured = !item.featured;
      saveListings();
      renderListings();
      renderAdminBody();
    }

    function adminTogglePause(id) {
      const item = state.listings.find((x) => x.id === id);
      if (!item) return;
      item.paused = !item.paused;
      saveListings();
      renderListings();
      renderAdminBody();
    }

    function adminDeleteItem(id) {
      state.listings = state.listings.filter((x) => x.id !== id);
      saveListings();
      renderListings();
      renderAdminBody();
      showToast("Publicación eliminada");
    }

    function dismissReport(id) {
      state.reports = state.reports.filter((r) => r.id !== id);
      saveReports();
      renderAdminBody();
    }

    function saveAdminSettings() {
      const r = parseFloat(document.getElementById("rateInput").value);
      if (!isNaN(r) && r > 0) {
        state.rate = r;
        localStorage.setItem(STORAGE_KEYS.RATE, String(r));
      }
      const cfgText = document.getElementById("firebaseCfgInput").value.trim();
      localStorage.setItem(STORAGE_KEYS.FIREBASE_CFG, cfgText);
      renderListings();
      showToast("Configuración guardada");
    }

    // Init
    updateFavCount();
    renderCategories();
    renderListings();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWiAHim-kh0o5yQT3W6RULY_BD1dqXVQ",
    authDomain: "plaza-libre-c8e29.firebaseapp.com",
    projectId: "plaza-libre-c8e29",
    storageBucket: "plaza-libre-c8e29.firebasestorage.app",
    messagingSenderId: "369114910443",
    appId: "1:369114910443:web:caca7ddb3a6db767d3b8se",
    measurementId: "G-V3PL10EJCE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.dbPlazaLibre = db;
  window.addDocPlazaLibre = addDoc;
  window.collectionPlazaLibre = collection;

  async function cargarProductosFirestore() {
    try {
      const querySnapshot = await getDocs(collection(db, "productos"));
      const productosNube = [];
      querySnapshot.forEach((doc) => {
        const d = doc.data();
        productosNube.push({
          id: doc.id,
          title: d.title || d.titulo || "Sin título",
          priceUsd: Number(d.priceUsd ?? d.precio ?? 0),
          category: d.category || d.categoria || "Todo",
          condition: d.condition || d.condicion || "Nuevo",
          location: d.location || d.ciudad || "Puerto Ordaz",
          description: d.description || d.descripcion || "",
          phone: d.phone || d.telefono || "",
          image: d.image || d.imagen || "",
          featured: Boolean(d.featured),
          paused: Boolean(d.paused),
          createdAt: d.createdAt || Date.now()
        });
      });

      if (productosNube.length > 0 && typeof state !== "undefined") {
        state.listings = productosNube;
        if (typeof renderListings === "function") renderListings();
      }
    } catch (error) {
      console.error("Error cargando productos:", error);
    }
  }

  cargarProductosFirestore();
</script>
</body>
